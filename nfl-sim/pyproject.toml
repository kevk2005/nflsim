[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflsim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "nflreadpy",
  "polars",
  "pandas",
  "pyarrow",
  "numpy",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "streamlit",
  "certifi",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
